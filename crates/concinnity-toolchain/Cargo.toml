[package]
name = "concinnity-toolchain"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Build-script support: rendering-backend cfg resolution and graphics SDK
# detection/bundling, shared by every package whose build script produces a
# final Windows artifact (the editor binary, the example binaries) plus the
# runtime crate's own tests. This is distinct from `concinnity-cook`, which is
# the asset compile pipeline; this crate is consumed only under
# `[build-dependencies]` and never linked into a shipped binary.
[lib]
name = "concinnity_toolchain"
path = "src/lib.rs"
doctest = false

[features]
# First-run asset fetching for the examples. Off by default so the ten crates
# that build-depend on this one do not compile an HTTP and zip stack.
fetch = ["dep:ureq", "dep:zip"]

[dependencies]
concinnity-slang = { path = "../concinnity-slang" }
ureq = { version = "3.2.0", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
tempfile = "3.25.0"

[lints]
workspace = true
