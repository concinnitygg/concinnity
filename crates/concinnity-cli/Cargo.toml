[package]
name = "concinnity-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The `concinnity` dev CLI binary: the clap command tree + dispatch and the
# subcommand implementations, over the dev-session entry points concinnity-editor
# exposes and the concinnity-cook compile pipeline. Also owns the Windows
# Agility SDK export statics the final binary must carry (src/main.rs) and the
# graphics-SDK DLL bundling its build script performs.
[[bin]]
name = "concinnity"
path = "src/main.rs"

[features]
# Target the Vulkan backend. Activates this crate's optional ash/shaderc so the
# final binary links them, and forwards to the editor library (and, through it,
# the runtime / device / compile pipeline / core).
vulkan = [
    "dep:ash",
    "dep:shaderc",
    "concinnity-editor/vulkan",
]

[dependencies]
concinnity-editor = { path = "../concinnity-editor" }
concinnity-cook = { path = "../concinnity-cook" }
concinnity-engine = { path = "../concinnity-engine" }
concinnity-memory = { path = "../concinnity-memory" }

clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1.44"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.25.0"

# Linux (and any non-macOS/non-Windows target) always builds the Vulkan backend:
# the final binary links its runtime crates directly.
[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
ash = "0.38"
glfw = "0.61.0"
shaderc = "0.10.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Dxc",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
ash = { version = "0.38", optional = true }
shaderc = { version = "0.10.1", optional = true }

[build-dependencies]
concinnity-toolchain = { path = "../concinnity-toolchain" }
