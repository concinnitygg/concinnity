[package]
name = "concinnity-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line tool for the Concinnity engine: build, run, add, export, debug"
keywords = ["gamedev", "cli", "concinnity"]
categories = ["game-engines", "command-line-utilities"]
include = [
    "/src",
    "/build.rs",
    "/assets",
    "/tests",
]

# The `concinnity` dev CLI binary: the clap command tree + dispatch and the
# subcommand implementations, over the dev-session entry points concinnity-editor
# exposes and the concinnity-cook compile pipeline. Also owns the Windows
# Agility SDK export statics the final binary must carry (src/main.rs) and the
# graphics-SDK DLL bundling its build script performs.
[[bin]]
name = "concinnity"
path = "src/main.rs"
# Shares its name with the framework facade's lib target, which collides in
# `cargo doc --workspace`; a CLI binary has no rustdoc to publish anyway.
doc = false

[features]
# Target the Vulkan backend. Activates this crate's optional ash/shaderc so the
# final binary links them, and forwards to the editor library (and, through it,
# the runtime / device / compile pipeline / core).
vulkan = [
    "dep:ash",
    "dep:shaderc",
    "concinnity-editor/vulkan",
]

[dependencies]
concinnity-editor = { workspace = true }
concinnity-cook = { workspace = true }
concinnity-shader = { workspace = true }
concinnity-engine = { workspace = true, features = ["alloc-detail"] }
concinnity-memory = { workspace = true }
concinnity-world = { workspace = true }

clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1.44"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.25.0"

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
ash = "0.38"
glfw = "0.61.0"
shaderc = { version = "0.10.1", features = ["build-from-source"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Dxc",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
ash = { version = "0.38", optional = true }
shaderc = { version = "0.10.1", optional = true }

# A macOS Vulkan build, activated by the `vulkan` feature. No GLFW: windowing is
# the shared native AppKit layer the Metal backend also uses.
[target.'cfg(target_os = "macos")'.dependencies]
ash = { version = "0.38", optional = true }
shaderc = { version = "0.10.1", optional = true, features = ["build-from-source"] }

[build-dependencies]
concinnity-toolchain = { workspace = true }

[lints]
workspace = true
