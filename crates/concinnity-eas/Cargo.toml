[package]
name = "concinnity-eas"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Entity/archetype storage backing the Concinnity ECS"
keywords = ["gamedev", "ecs", "concinnity"]
categories = ["game-engines", "data-structures", "no-std"]
include = [
    "/src",
    "/tests",
]

[lib]
name = "concinnity_eas"

# No dependencies on purpose. EAS is the closed-world ECS mechanism and must
# stay free of engine domain types and heavy crates: the dependency arrow is
# concinnity-eas <- concinnity-core <- concinnity-engine. A thread pool is
# injected as a trait rather than taken as a dependency here.
[dependencies]

