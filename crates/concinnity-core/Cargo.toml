[package]
name = "concinnity-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Runtime vocabulary for the Concinnity engine: GPU layouts, ECS components, registry, CPU kernels"
keywords = ["gamedev", "graphics", "ecs", "concinnity"]
categories = ["game-engines", "no-std"]
include = [
    "/src",
    "/tests",
    "/build.rs",
]

[lib]
name = "concinnity_core"
path = "src/lib.rs"

[features]
# Per-size-class allocation histograms, for development binaries only. The
# global counters and the tagged ledger ship unconditionally; this is the tier a
# shipped build should not pay for on every allocation.
detail = []

# Selects backend_vk on Windows (via build.rs reading CARGO_FEATURE_VULKAN) so
# the backend-conditional gfx data layouts and Platform::current() compile for
# the same backend the client picks. Activates no extra dependency. Inert on
# Linux (always vk) and macOS (always metal).
vulkan = []

[dependencies]

bytemuck = { version = "1", default-features = false, features = ["derive"] }
fontdue = { version = "0.9", default-features = false, features = ["hashbrown", "simd"] }
hashbrown = "0.15"
libm = "0.2"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_bytes = { version = "0.11", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0.18", default-features = false }

[dev-dependencies]
ciborium = "0.2"
rayon = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
rayon = "1"

[lints]
workspace = true
