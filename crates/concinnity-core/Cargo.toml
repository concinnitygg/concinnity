[package]
name = "concinnity-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Runtime vocabulary for the Concinnity engine: GPU layouts, ECS components, registry"
keywords = ["gamedev", "graphics", "ecs", "concinnity"]
categories = ["game-engines", "no-std"]
include = [
    "/src",
    "/build.rs",
]

[lib]
name = "concinnity_core"
path = "src/lib.rs"

[features]
# Selects backend_vk on Windows (via build.rs reading CARGO_FEATURE_VULKAN) so
# the backend-conditional gfx data layouts and Platform::current() compile for
# the same backend the client picks. Activates no extra dependency. Inert on
# Linux (always vk) and macOS (always metal). concinnity-cpu forwards its own
# `vulkan` feature here so the two resolve the same backend.
vulkan = []

[dependencies]
concinnity-asset = { workspace = true }
concinnity-blob = { workspace = true }
concinnity-eas = { workspace = true }
concinnity-memory = { workspace = true }

bytemuck = { version = "1", default-features = false, features = ["derive"] }
libm = "0.2"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2.0.18", default-features = false }
tracing = { version = "0.1.44", default-features = false }

[build-dependencies]
concinnity-toolchain = { workspace = true }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
