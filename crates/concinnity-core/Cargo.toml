[package]
name = "concinnity-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The no_std foundation of the Concinnity engine: math, allocation tracking, thread fan-out"
readme = "README.md"
keywords = ["gamedev", "math", "no-std", "concinnity"]
categories = ["game-engines", "no-std"]
include = [
    "/README.md",
    "/src",
]

[features]
# The timing harness and test fan-outs other crates' tests share.
test-support = []
# Per-size-class allocation histograms, for development binaries only. The
# global counters and the tagged ledger ship unconditionally; this is the tier a
# shipped build should not pay for on every allocation.
detail = []

[dependencies]
libm = { workspace = true }

[dev-dependencies]
spin = { workspace = true, features = ["spin_mutex"] }

[lints]
workspace = true
