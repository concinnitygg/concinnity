[package]
name = "concinnity-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "concinnity_core"
path = "src/lib.rs"

[features]
# Selects backend_vk on Windows (via build.rs reading CARGO_FEATURE_VULKAN) so
# the backend-conditional gfx data layouts and Platform::current() compile for
# the same backend the client picks. Activates no extra dependency. Inert on
# Linux (always vk) and macOS (always metal). concinnity-cpu forwards its own
# `vulkan` feature here so the two resolve the same backend.
vulkan = []

[dependencies]
concinnity-asset = { path = "../concinnity-asset" }
concinnity-blob = { path = "../concinnity-blob" }
concinnity-eas = { path = "../concinnity-eas" }
concinnity-memory = { path = "../concinnity-memory" }

bytemuck = { version = "1", default-features = false, features = ["derive"] }
libm = "0.2"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2.0.18", default-features = false }
tracing = { version = "0.1.44", default-features = false }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
