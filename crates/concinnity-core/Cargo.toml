[package]
name = "concinnity-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "concinnity_core"
path = "src/lib.rs"
doctest = false

[features]
# Forwarded to concinnity-types, whose build script resolves the backend cfg the
# gfx data layouts and Platform::current() compile against. Activates no extra
# dependency. Inert on Linux (always vk) and macOS (always metal).
vulkan = ["concinnity-types/vulkan"]

[dependencies]
concinnity-types = { path = "../concinnity-types" }
concinnity-asset = { path = "../concinnity-asset" }
concinnity-memory = { path = "../concinnity-memory" }

bytemuck = { version = "1", features = ["derive"] }
rayon = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
