[package]
name = "concinnity-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Runtime vocabulary for the Concinnity engine: GPU layouts, ECS components, registry, CPU kernels"
readme = "README.md"
keywords = ["gamedev", "graphics", "ecs", "concinnity"]
categories = ["game-engines", "no-std"]
include = [
    "/README.md",
    "/src",
    "/tests",
    "/build.rs",
]

[features]
# Per-size-class allocation histograms, for development binaries only. The
# global counters and the tagged ledger ship unconditionally; this is the tier a
# shipped build should not pay for on every allocation.
detail = []
# The authored schema's static description, rustdoc included, for authoring tools.
schema = ["dep:erased-serde"]

[dependencies]

bytemuck = { workspace = true, features = ["derive"] }
concinnity-derive = { workspace = true }
erased-serde = { version = "0.4", default-features = false, features = ["alloc"], optional = true }
fontdue = { version = "0.9", default-features = false, features = ["hashbrown", "simd"] }
hashbrown = "0.17.1"
libm = "0.2"
postcard = { workspace = true, features = ["alloc"] }
serde = { workspace = true, features = ["alloc", "derive"] }
serde_bytes = { version = "0.11", default-features = false, features = ["alloc"] }
spin = { version = "0.12.3", default-features = false, features = ["once"] }
thiserror = { workspace = true }

[dev-dependencies]
ciborium = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }

[build-dependencies]
rayon = { workspace = true }

[lints]
workspace = true
