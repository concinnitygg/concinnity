[package]
name = "concinnity-cook"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Asset cook pipeline that bakes an authored Concinnity world into a blob"
keywords = ["gamedev", "assets", "concinnity"]
categories = ["game-engines", "development-tools::build-utils"]
include = [
    "/src",
    "/assets",
    "/build.rs",
]

[lib]
name = "concinnity_cook"
path = "src/lib.rs"

[dependencies]
concinnity-core = { workspace = true }
concinnity-cpu = { workspace = true }
concinnity-store = { workspace = true }
concinnity-blob = { workspace = true }
concinnity-world = { workspace = true }
concinnity-docs = { workspace = true }
concinnity-font = { workspace = true }

bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2.0.18"
tracing = "0.1.44"
postcard = { version = "1", default-features = false, features = ["use-std"] }
fbxcel = { version = "0.9.0", default-features = false, features = ["tree"] }
gltf = { version = "1", default-features = false, features = ["utils", "names", "extras"] }
jpeg-decoder = "0.3"
kira = "0.12"
ktx2 = "0.5"
basisu = "=0.1.0"
ruzstd = "0.8"
png = "0.18.1"
pulldown-cmark = { version = "0.13", default-features = false }
rayon = "1"
sha2 = "0.10.9"
time = { version = "0.3.47", features = ["formatting", "parsing"] }

[build-dependencies]
concinnity-toolchain = { workspace = true }

[dev-dependencies]
# The binary FBX writer builds synthetic .fbx fixtures for the importer tests.
fbxcel = { version = "0.9.0", default-features = false, features = ["tree", "writer"] }
tempfile = "3.25.0"

[lints]
workspace = true
