[package]
name = "concinnity-cook"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Authored world model, validation, and the asset cook pipeline that bakes a Concinnity world into a blob"
readme = "README.md"
keywords = ["gamedev", "assets", "concinnity"]
categories = ["game-engines", "development-tools::build-utils"]
include = [
    "/README.md",
    "/src",
    "/assets",
]

[features]
schema = ["concinnity-core/schema"]

[dependencies]
concinnity-core = { workspace = true }
concinnity-host = { workspace = true }
concinnity-shader = { workspace = true, features = ["spirv-cross"] }

bytemuck = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
postcard = { workspace = true, features = ["use-std"] }
fbxcel = { workspace = true, features = ["tree"] }
gltf = { workspace = true, features = ["utils", "names", "extras"] }
hex = { workspace = true }
jpeg-decoder = { workspace = true }
kira = { workspace = true }
ktx2 = { workspace = true }
basisu = { workspace = true }
ruzstd = { workspace = true, features = ["std"] }
png = { workspace = true }
pulldown-cmark = { workspace = true }
rayon = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }

[dev-dependencies]
concinnity-testing = { workspace = true }
# The binary FBX writer builds synthetic .fbx fixtures for the importer tests.
fbxcel = { workspace = true, features = ["tree", "writer"] }
tempfile = { workspace = true }

[lints]
workspace = true
