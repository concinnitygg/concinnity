[package]
name = "concinnity-cook"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Authored world model, validation, and the asset cook pipeline that bakes a Concinnity world into a blob"
readme = "README.md"
keywords = ["gamedev", "assets", "concinnity"]
categories = ["game-engines", "development-tools::build-utils"]
include = [
    "/README.md",
    "/src",
    "/assets",
]

[dependencies]
concinnity-core = { workspace = true }
concinnity-host = { workspace = true }
concinnity-slang = { workspace = true }

bytemuck = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tracing = { workspace = true }
postcard = { workspace = true, features = ["use-std"] }
fbxcel = { workspace = true, features = ["tree"] }
gltf = { workspace = true, features = ["utils", "names", "extras"] }
hex = { workspace = true }
jpeg-decoder = "0.3"
kira = { workspace = true }
ktx2 = "0.5"
basisu = "=0.1.0"
ruzstd = "0.9.0"
png = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false }
rayon = { workspace = true }
sha2 = { workspace = true }
time = { version = "0.3.47", features = ["formatting", "parsing"] }

[dev-dependencies]
concinnity-testing = { workspace = true }
# The binary FBX writer builds synthetic .fbx fixtures for the importer tests.
fbxcel = { workspace = true, features = ["tree", "writer"] }
tempfile = { workspace = true }

[lints]
workspace = true
