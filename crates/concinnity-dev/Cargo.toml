[package]
name = "concinnity-dev"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The Concinnity dev tooling library: world authoring, the in-engine editor, the debug server, docs and packaging"
readme = "README.md"
keywords = ["gamedev", "editor", "cli", "concinnity"]
categories = ["game-engines", "development-tools"]
include = [
    "/README.md",
    "/src",
    "/assets",
    "/build.rs",
]

[features]
vulkan = ["concinnity-runtime/vulkan"]

[dependencies]
anstyle-query = { workspace = true }
ciborium = { workspace = true }
clap = { workspace = true, features = ["derive", "string"] }
concinnity-runtime = { workspace = true }
concinnity-cook = { workspace = true, features = ["schema"] }
concinnity-engine = { workspace = true, features = ["schema"] }
concinnity-core = { workspace = true }
concinnity-host = { workspace = true }
notify = { workspace = true, features = ["macos_fsevent"] }
png = { workspace = true }
rayon = { workspace = true }
rfd = { workspace = true, features = ["xdg-portal"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["preserve_order"] }
terminal_size = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ureq = { workspace = true }
zip = { workspace = true, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }

[dev-dependencies]
concinnity-engine = { workspace = true, features = ["test-support"] }
concinnity-core = { workspace = true, features = ["test-support"] }
concinnity-shader = { workspace = true }
concinnity-testing = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
concinnity-toolchain = { workspace = true }

[lints]
workspace = true
