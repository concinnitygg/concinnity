[package]
name = "concinnity-blob"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Packed asset blob container format for the Concinnity engine"
keywords = ["gamedev", "assets", "concinnity"]
categories = ["game-engines", "encoding", "no-std"]
include = [
    "/src",
    "/build.rs",
]

# The .cnb blob container format: the record schema, the 16-byte header, the
# format version, and the pure bytes <-> metadata transforms. Performs no I/O
# and holds no residency policy -- concinnity-store owns the `.concinnity/`
# layout and `BlobData`, concinnity-cook writes what `encode_cnb` returns. That
# keeps the crate no_std, so a no_std client runtime can decode blobs with its
# own byte source.
[lib]
name = "concinnity_blob"
path = "src/lib.rs"

[dependencies]
concinnity-asset = { workspace = true }

postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_bytes = { version = "0.11", default-features = false, features = ["alloc"] }

[build-dependencies]
concinnity-toolchain = { workspace = true }

[lints]
workspace = true
