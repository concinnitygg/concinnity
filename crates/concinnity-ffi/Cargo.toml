[package]
name = "concinnity-ffi"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The general-purpose C-ABI cdylib a host application links, plus an rlib so the
# FFI surface can be unit-tested. The lib is named `concinnity_ffi`, so the
# cdylib is `libconcinnity_ffi.dylib` (macOS) / `concinnity_ffi.dll` (Windows);
# the host's link settings must reference that artifact name. The generated C
# header (include/concinnity.h) is the public API.
[lib]
name = "concinnity_ffi"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
doctest = false

[features]
# Forward a Vulkan build down to the editor library, the runtime, the device
# backends, the compile pipeline, and core.
vulkan = [
    "concinnity-editor/vulkan",
    "concinnity-engine/vulkan",
    "concinnity-device/vulkan",
    "concinnity-cook/vulkan",
    "concinnity-core/vulkan",
]

[dependencies]
# The dev tooling library: the authoring / in-memory build API the ffi drives
# (add / rm / check / world_from_loaded).
concinnity-editor = { path = "../concinnity-editor" }
# The runtime crate (rlib): App, the render loop, and the ecs StepResult the ffi
# steps the world through.
concinnity-engine = { path = "../concinnity-engine" }
# The device backends: the embedded-preview hooks (set_preview_view) the host
# app drives.
concinnity-device = { path = "../concinnity-device" }
# The asset compile pipeline the ffi build / preview entries drive directly.
concinnity-cook = { path = "../concinnity-cook" }
# Named for the `vulkan` feature forward; also reached transitively.
concinnity-core = { path = "../concinnity-core" }
tracing = "0.1.44"

[target.'cfg(target_os = "macos")'.dependencies]
# ffi's blocking/preview run loops pump the Cocoa run loop.
core-foundation = "0.10.1"

[dev-dependencies]
tempfile = "3.25.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[build-dependencies]
cbindgen = "0.29"
concinnity-toolchain = { path = "../concinnity-toolchain" }
