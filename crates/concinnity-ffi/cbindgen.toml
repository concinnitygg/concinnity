language = "C"
pragma_once = true
documentation = true
documentation_style = "c99"
autogen_warning = "/* Generated by cbindgen from src/ffi.rs. Do not edit. */"
style = "type"

sys_includes = []
includes = []
no_includes = true

[parse]
parse_deps = false

[enum]
# Qualify the variants: a C header that defines a bare `Continue` or `Done` at
# global scope collides with the host's own names.
prefix_with_name = true
