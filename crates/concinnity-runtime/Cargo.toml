[package]
name = "concinnity-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Pass-through so a macOS or Windows host can target the Vulkan backend instead
# of the default Metal / DirectX one, matching the rest of the workspace. Inert
# on Linux (always Vulkan).
vulkan = ["concinnity-engine/vulkan"]

[dependencies]
concinnity-engine = { path = "../concinnity-engine" }
concinnity-memory = { path = "../concinnity-memory" }

[build-dependencies]
concinnity-toolchain = { path = "../concinnity-toolchain" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
