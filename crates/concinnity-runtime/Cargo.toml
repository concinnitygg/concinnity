[package]
name = "concinnity-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Standalone runtime player for a cooked Concinnity world"
keywords = ["gamedev", "runtime", "concinnity"]
categories = ["game-engines", "command-line-utilities"]
include = [
    "/src",
    "/build.rs",
]

[features]
# Pass-through so a macOS or Windows host can target the Vulkan backend instead
# of the default Metal / DirectX one, matching the rest of the workspace. Inert
# on Linux (always Vulkan).
vulkan = ["concinnity-engine/vulkan"]

[dependencies]
concinnity-engine = { workspace = true }
concinnity-memory = { workspace = true }

[build-dependencies]
concinnity-toolchain = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
