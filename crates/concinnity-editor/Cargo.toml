[package]
name = "concinnity-editor"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "concinnity_editor"
path = "src/lib.rs"
doctest = false

[features]
# Mirror the runtime's Vulkan feature so an editor build can target the Vulkan
# backend; forwards to the runtime, the device backends, the compile pipeline,
# and core.
vulkan = [
    "concinnity-engine/vulkan",
    "concinnity-device/vulkan",
    "concinnity-shader/vulkan",
    "concinnity-core/vulkan",
]

[dependencies]
concinnity-engine = { path = "../concinnity-engine" }
concinnity-device = { path = "../concinnity-device" }
concinnity-cook = { path = "../concinnity-cook" }
concinnity-world = { path = "../concinnity-world" }
concinnity-shader = { path = "../concinnity-shader" }
concinnity-core = { path = "../concinnity-core" }
concinnity-memory = { path = "../concinnity-memory" }

argon2 = "0.5"
async-stream = "0.3.6"
ciborium = "0.2"
bitflags = "2.0"
chrono = "0.4.44"
ctrlc = "3.5.2"
directories = "6.0.0"
gltf = { version = "1", default-features = false, features = ["utils", "names"] }
hex = "0.4.3"
hmac = "0.12.1"
ignore = "0.4.25"
jsonwebtoken = "9"
libloading = "0.9.0"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
png = "0.18.1"
rand = "0.8"
rayon = "1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = { version = "1", features = ["preserve_order"] }
slotmap = "1.1.1"
thiserror = "2.0.18"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
ureq = { version = "3.2.0", features = ["json"] }

[dev-dependencies]
tempfile = "3.25.0"

[build-dependencies]
concinnity-toolchain = { path = "../concinnity-toolchain" }
