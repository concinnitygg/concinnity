[package]
name = "concinnity-host"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Host services for Concinnity: the on-disk state tree and the thread-scoped services"
readme = "README.md"
keywords = ["gamedev", "filesystem", "threadpool", "concinnity"]
categories = ["game-engines", "filesystem"]
include = [
    "/README.md",
    "/src",
]

[dependencies]
concinnity-core = { workspace = true }

rayon = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
concinnity-testing = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
