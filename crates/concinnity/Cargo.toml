[package]
name = "concinnity"
default-run = "concinnity"
include = [
    "/src",
    "/build.rs",
    "/README.md",
    "/LICENSE",
]
version.workspace = true
description.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "concinnity"
required-features = ["editor"]
doc = false

[[bin]]
name = "concinnity-player"
required-features = ["std"]

[[test]]
name = "cli"
required-features = ["editor"]

[[example]]
name = "cube"
path = "examples/cube/main.rs"
required-features = ["std"]

[[example]]
name = "planet"
path = "examples/planet/main.rs"
required-features = ["cook"]

[package.metadata.docs.rs]
no-default-features = true
features = ["cook"]
default-target = "x86_64-apple-darwin"
targets = ["x86_64-apple-darwin", "x86_64-pc-windows-msvc"]

[features]
default = ["std", "cook", "editor"]
std = ["dep:concinnity-runtime", "dep:concinnity-host", "dep:concinnity-toolchain"]
editor = ["cook", "dep:concinnity-dev"]
cook = ["std", "dep:concinnity-cook", "dep:concinnity-vendor"]
vulkan = ["std", "concinnity-runtime/vulkan", "concinnity-dev?/vulkan"]

[dependencies]
concinnity-core = { workspace = true }
concinnity-engine = { workspace = true }
concinnity-runtime = { workspace = true, optional = true }
concinnity-host = { workspace = true, optional = true }
concinnity-cook = { workspace = true, optional = true }
concinnity-dev = { workspace = true, optional = true }
concinnity-vendor = { workspace = true, optional = true }

[dev-dependencies]
concinnity-testing = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
concinnity-toolchain = { workspace = true, optional = true }

[lints]
workspace = true
