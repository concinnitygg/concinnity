[package]
name = "concinnity-engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "concinnity_engine"
crate-type = ["rlib"]
path = "src/lib.rs"
doctest = false

[features]
# Build the macOS or Windows client against the Vulkan backend instead of the
# default Metal / DirectX one. Linux always uses Vulkan regardless; build.rs
# resolves the backend cfg from the target and this feature. Windows Vulkan uses
# the shared native Win32 window layer; macOS Vulkan uses GLFW, as Linux does.
vulkan = [
    "concinnity-device/vulkan",
    "concinnity-cpu/vulkan",
    "concinnity-render/vulkan",
]

# Per-size-class allocation histograms on top of the counters every binary
# already gets. The allocator itself is installed by linking this crate (see
# `src/heap.rs`); this is the tier a shipped build should not pay for, so a
# development binary asks for it here rather than depending on the allocator
# crate to reach the feature.
alloc-detail = ["concinnity-memory/detail"]

[dependencies]
concinnity-core = { path = "../concinnity-core" }
concinnity-cpu = { path = "../concinnity-cpu" }
concinnity-store = { path = "../concinnity-store" }
concinnity-render = { path = "../concinnity-render" }
concinnity-device = { path = "../concinnity-device" }
concinnity-physics = { path = "../concinnity-physics" }
concinnity-audio = { path = "../concinnity-audio" }
concinnity-memory = { path = "../concinnity-memory" }

ciborium = "0.2"
gilrs = "0.11.2"
postcard = { version = "1", default-features = false, features = ["use-std"] }
ctrlc = "3.5.2"
serde = { version = "1", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
crash-handler = "0.8"
minidump-writer = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS run loop for `cn run` (app/run.rs drives NSApplication + the
# CFRunLoop directly, and needs a MainThreadMarker). The Metal backend's wider
# objc2 stack lives in concinnity-device.
core-foundation = "0.10.1"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"

[target.'cfg(unix)'.dependencies]
# Host-memory queries (app/sysmem.rs): sysctl `hw.memsize` + mach `task_info`
# on macOS; `/proc` on Linux only needs the page size from here.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Host-memory queries (app/sysmem.rs): GlobalMemoryStatusEx + GetProcessMemoryInfo.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3.25.0"
concinnity-memory = { path = "../concinnity-memory" }

[build-dependencies]
concinnity-toolchain = { path = "../concinnity-toolchain" }
