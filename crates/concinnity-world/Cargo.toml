[package]
name = "concinnity-world"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Authored world source, args schema, validation, and spec builders for Concinnity"
keywords = ["gamedev", "assets", "concinnity"]
categories = ["game-engines", "development-tools::build-utils"]
include = [
    "/src",
]

# The build-side world front half: the authored world model (world.jsonl
# parse/write, WorldJsonlAsset), the authoring type vocabulary (ComponentType,
# ResourceAssetType), asset cross-reference metadata, and semantic validation.
# Consumed by concinnity-cook, the editor, the CLI, and docs. The runtime tier
# (core/render/device/engine/runtime) must NEVER depend on this crate: a
# shipped game plays compiled blobs and never sees authored input. Links no
# importers, encoders, or compilers -- those stay in concinnity-cook, which
# composes its compile-backed checks through this crate's hooks.
[lib]
name = "concinnity_world"
path = "src/lib.rs"

[dependencies]
concinnity-core = { workspace = true }
concinnity-host = { workspace = true }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.25.0"

[lints]
workspace = true
