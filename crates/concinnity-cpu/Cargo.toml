[package]
name = "concinnity-cpu"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CPU compute over the Concinnity asset vocabulary: codecs, geometry, kernels"
keywords = ["gamedev", "geometry", "concinnity"]
categories = ["game-engines"]
include = [
    "/src",
    "/build.rs",
]

[lib]
name = "concinnity_cpu"
path = "src/lib.rs"

[features]
# Forwarded to concinnity-core, whose build script resolves the backend cfg the
# gfx data layouts and Platform::current() compile against. Activates no extra
# dependency. Inert on Linux (always vk) and macOS (always metal).
vulkan = ["concinnity-core/vulkan"]

[dependencies]
concinnity-core = { workspace = true }
concinnity-asset = { workspace = true }
concinnity-memory = { workspace = true }

bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
tracing = "0.1.44"

[build-dependencies]
concinnity-toolchain = { workspace = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
