[package]
name = "concinnity-cpu"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "concinnity_cpu"
path = "src/lib.rs"

[features]
# Forwarded to concinnity-core, whose build script resolves the backend cfg the
# gfx data layouts and Platform::current() compile against. Activates no extra
# dependency. Inert on Linux (always vk) and macOS (always metal).
vulkan = ["concinnity-core/vulkan"]

[dependencies]
concinnity-core = { path = "../concinnity-core" }
concinnity-asset = { path = "../concinnity-asset" }
concinnity-memory = { path = "../concinnity-memory" }

bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
tracing = "0.1.44"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
