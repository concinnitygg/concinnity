[package]
name = "concinnity-device"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "GPU backends (Metal, Vulkan, DirectX) behind a device facade for Concinnity"
readme = "README.md"
keywords = ["gamedev", "vulkan", "metal", "directx", "concinnity"]
categories = ["game-engines", "rendering::graphics-api"]
include = [
    "/README.md",
    "/src",
    "/build.rs",
]

[features]
default = ["native"]
native = []
metal = []
directx = []
vulkan = ["dep:ash", "dep:libloading"]

[dependencies]
concinnity-core = { workspace = true }
concinnity-host = { workspace = true }
concinnity-shader = { workspace = true }

bytemuck = { workspace = true, features = ["derive"] }
hex = { workspace = true }
png = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(not(any(target_vendor = "apple", target_os = "windows")))'.dependencies]
ash = { workspace = true }
libloading = { workspace = true }

[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
glfw = { workspace = true, features = ["vulkan", "x11", "wayland", "prebuilt-libs", "raw-window-handle-v0-6"] }

[target.'cfg(target_os = "windows")'.dependencies]
ash = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
ash = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
block2 = { workspace = true }
dispatch2 = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-metal = { workspace = true }
objc2-metal-fx = { workspace = true }
objc2-metal-kit = { workspace = true }
objc2-quartz-core = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The MSL leg links spirv-cross; only the Metal backend translates to MSL.
concinnity-shader = { workspace = true, features = ["spirv-cross"] }
objc2-app-kit = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }

[dev-dependencies]
# The layout guard reads a compiled module's decorations, on every backend.
concinnity-shader = { workspace = true, features = ["spirv-cross"] }
concinnity-testing = { workspace = true }

[build-dependencies]
concinnity-core = { workspace = true }
concinnity-shader = { workspace = true }
concinnity-toolchain = { workspace = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
concinnity-shader = { workspace = true, features = ["spirv-cross"] }

[lints]
workspace = true
