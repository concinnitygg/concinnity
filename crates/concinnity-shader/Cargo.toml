[package]
name = "concinnity-shader"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "concinnity_shader"
path = "src/lib.rs"
doctest = false

[features]
vulkan = ["dep:shaderc", "concinnity-device/vulkan"]

[dependencies]
concinnity-cook = { path = "../concinnity-cook" }
concinnity-device = { path = "../concinnity-device" }

tracing = "0.1.44"

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
shaderc = { version = "0.10.1", features = ["build-from-source"] }

# The Windows default build is DirectX, which compiles HLSL through the
# Direct3D `Fxc` compiler from the `windows` crate. `shaderc` is optional and
# activated by the `vulkan` feature for a Vulkan build on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
] }
shaderc = { version = "0.10.1", optional = true }

[dev-dependencies]
tempfile = "3.25.0"

[build-dependencies]
concinnity-toolchain = { path = "../concinnity-toolchain" }
