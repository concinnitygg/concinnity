[package]
name = "concinnity-shader"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Build-time shader compilers for the Concinnity engine backends"
readme = "README.md"
keywords = ["gamedev", "shader", "concinnity"]
categories = ["game-engines", "rendering::graphics-api"]
include = [
    "/README.md",
    "/src",
    "/build.rs",
]

[features]
default = ["native"]
native = ["dep:concinnity-device", "concinnity-device/native"]
metal = ["dep:concinnity-device", "concinnity-device/metal"]
directx = []
vulkan = ["dep:shaderc"]

[dependencies]
concinnity-cook = { workspace = true }
concinnity-device = { workspace = true, optional = true }

tracing = "0.1.44"

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
shaderc = { version = "0.10.1", features = ["build-from-source"] }

# The Windows default build is DirectX, which compiles HLSL through the
# Direct3D `Fxc` compiler from the `windows` crate. `shaderc` is optional and
# activated by the `vulkan` feature for a Vulkan build on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
] }
shaderc = { version = "0.10.1", optional = true }

# The macOS default build is Metal, whose shaders precompile at build time.
# `shaderc` is optional and activated by the `vulkan` feature for a Vulkan build
# on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
shaderc = { version = "0.10.1", optional = true, features = ["build-from-source"] }

[dev-dependencies]
concinnity-testing = { workspace = true }
tempfile = "3.25.0"

[build-dependencies]
concinnity-toolchain = { workspace = true }

[lints]
workspace = true
