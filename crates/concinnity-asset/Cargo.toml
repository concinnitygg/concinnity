[package]
name = "concinnity-asset"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "User-facing asset schema for the Concinnity engine"
keywords = ["gamedev", "assets", "schema", "concinnity"]
categories = ["game-engines", "no-std"]
include = [
    "/src",
    "/build.rs",
    "/tests",
]

[lib]
name = "concinnity_asset"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[build-dependencies]
concinnity-toolchain = { workspace = true }

[dev-dependencies]
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }

[lints]
workspace = true
