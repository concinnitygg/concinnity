name: Vendor third-party binaries
description: Vendors the shader compiler with `concinnity vendor dxc`
runs:
  using: composite
  steps:
    - name: Restore Vendored Binaries
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: |
          vendor
          !vendor/.build
        key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/concinnity-dev/src/vendor/tools.rs', 'crates/concinnity-dev/src/vendor/source_build.rs') }}

    - name: Install Ninja
      if: runner.os == 'macOS' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: command -v ninja || brew install ninja

    - name: Vendor Binaries
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: cargo run --locked --all-features --bin concinnity -- vendor dxc

    # Saved before the build so a failing test does not throw away a source build.
    - name: Save Vendored Binaries
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          vendor
          !vendor/.build
        key: ${{ steps.restore.outputs.cache-primary-key }}
