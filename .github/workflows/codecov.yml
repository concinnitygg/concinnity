name: codecov

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: llvm-cov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install Stable Toolchain & Enable Cache
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview

      - name: Install Cargo Llvm-Cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # GPU backend code needs a real device/window and is verified by
      # screenshot probes rather than unit tests, so it is excluded from the
      # coverage metric. The same applies to the interpreted-run render loop
      # (concinnity-editor/src/run.rs) and the Metal shader-layout reflection
      # (concinnity-app/src/shader_reflect.rs), which need a live device.
      - name: Generate Coverage Report
        run: >
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          --ignore-filename-regex '/(metal|vulkan|directx|win32|wire)/|concinnity-editor/src/run\.rs|concinnity-app/src/shader_reflect\.rs'

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
