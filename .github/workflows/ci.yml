name: CI

on:
  push:
    branches: ["main", "master", "refactor/simplify"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Run Cargo Fmt
        run: cargo fmt --all --check

      - name: Run Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  build:
    name: Clippy, Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Keep LF Line Endings
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Linux Dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install Metal Toolchain
        if: runner.os == 'macOS'
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Install Shader Compiler
        uses: ./.github/actions/install-dxc

      - name: Run Clippy
        run: cargo clippy --locked --all-features --all-targets --workspace

      - name: Run Cargo Build
        run: cargo build --locked --all-features --all-targets --workspace

      - name: Run Doctests
        timeout-minutes: 20
        run: cargo test --locked --all-features --doc --workspace

      - name: Test Core Default Features
        run: cargo test --locked -p concinnity-core

      - name: Diagnose Wiring Tests
        if: runner.os == 'Windows'
        run: cargo test --locked --all-features -p concinnity-runtime --test wiring -- --test-threads=1

      - name: Run Tests
        timeout-minutes: 30
        run: cargo test --locked --all-features --all-targets --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Linux Dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install Shader Compiler
        uses: ./.github/actions/install-dxc

      - name: Install Cargo Llvm-Cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-nextest
          locked: true

      - name: Generate Coverage Report
        timeout-minutes: 30
        run: >
          cargo llvm-cov nextest --locked --all-features --workspace
          --lcov --output-path lcov.info
          --ignore-filename-regex 'concinnity-device/|/wire/'

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
