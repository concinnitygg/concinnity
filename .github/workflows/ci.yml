name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Run Cargo Fmt
        run: cargo fmt --all --check

      - name: Run Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  build:
    name: Clippy, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Linux Dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Run Clippy
        run: cargo clippy --locked --all-features --all-targets --workspace

      - name: Run Cargo Build
        run: cargo build --locked --all-features --all-targets --workspace

      - name: Run Doctests
        run: cargo test --locked --all-features --doc --workspace

      - name: Install Cargo Llvm-Cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate Coverage Report
        run: >
          cargo llvm-cov --locked --all-features --workspace
          --lcov --output-path lcov.info
          --ignore-filename-regex 'concinnity-device/|/wire/'

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
