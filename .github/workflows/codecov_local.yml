name: codecov_local

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage_local:
    name: llvm-cov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install Stable Toolchain & Enable Cache
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview

      - name: Install Cargo Llvm-Cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # The hardware backends live in concinnity-device (Metal/DirectX/Vulkan/
      # Win32); they need a real device/window and are verified by screenshot
      # probes rather than unit tests, so the whole crate is excluded from the
      # coverage metric. The GPU-free render-prep they build on lives in
      # concinnity-render and IS counted. The same device-bound exclusion applies
      # to the debug wire protocol (concinnity-editor/src/debug/wire), the
      # interpreted-run render loop (concinnity-editor/src/run.rs), and the Metal
      # shader-layout reflection (concinnity-app/src/shader_reflect.rs).
      - name: Generate Coverage Report
        run: >
          cargo llvm-cov --workspace --summary-only -q
          --ignore-filename-regex 'concinnity-device/|/wire/|concinnity-editor/src/run\.rs|concinnity-app/src/shader_reflect\.rs'
