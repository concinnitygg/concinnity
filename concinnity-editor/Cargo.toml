[package]
name = "concinnity-editor"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The `concinnity` dev CLI binary. The shared authoring/build code and the full
# C-ABI cdylib the Swift app links live in the concinnity-app crate; this crate
# is bin-only and depends on it.
[[bin]]
name = "concinnity"
path = "src/main.rs"

[features]
# Mirror the client's Vulkan feature so an editor build can target the Vulkan
# backend; forwards to the runtime crate, the compile pipeline, and core.
vulkan = [
    "dep:ash",
    "dep:shaderc",
    "concinnity-app/vulkan",
    "concinnity-client/vulkan",
    "concinnity-cook/vulkan",
    "concinnity-core/vulkan",
]

[dependencies]
# The embedding + authoring library: the shared add / rm / check / build code
# (`concinnity_app::authoring`) the CLI drives, plus the C-ABI cdylib.
concinnity-app = { path = "../concinnity-app" }
# The runtime crate (rlib): the editor drives a live App and the renderer
# through the runtime's public API.
concinnity-client = { path = "../concinnity-client" }
# The asset compile pipeline: cn build / cn add / cn debug.
# Carries the gltf/png/jpeg decoders; the CLI calls them through
# concinnity_cook::{glb,texture,color_lut,mesh_reimport}.
concinnity-cook = { path = "../concinnity-cook" }
# Direct core access for the world/geometry/ecs types the CLI/debug code names
# (concinnity_core::{world,build,geometry,ecs}).
concinnity-core = { path = "../concinnity-core" }
argon2 = "0.5"
async-stream = "0.3.6"
ciborium = "0.2"
bitflags = "2.0"
chrono = "0.4.44"
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ctrlc = "3.5.2"
directories = "6.0.0"
gltf = { version = "1", default-features = false, features = ["utils", "names"] }
hex = "0.4.3"
hmac = "0.12.1"
ignore = "0.4.25"
jsonwebtoken = "9"
libloading = "0.9.0"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
rand = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = { version = "1", features = ["preserve_order"] }
slotmap = "1.1.1"
thiserror = "2.0.18"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
ureq = { version = "3.2.0", features = ["json"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
ash = "0.38"
glfw = "0.61.0"
shaderc = "0.10.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Dxc",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
ash = { version = "0.38", optional = true }
shaderc = { version = "0.10.1", optional = true }

[dev-dependencies]
tempfile = "3.25.0"

[build-dependencies]
concinnity-toolchain = { path = "../concinnity-toolchain" }
