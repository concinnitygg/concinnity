[package]
name = "concinnity-app"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The C-ABI cdylib the Swift app links, plus an rlib the `concinnity` CLI links
# for the shared authoring/build code. The lib is named `concinnity_app`, so the
# cdylib is `libconcinnity_app.dylib` (macOS) / `concinnity_app.dll` (Windows);
# the Swift app link settings and bridging header must reference that artifact
# name. The generated C header path (include/concinnity.h) is unchanged.
[lib]
name = "concinnity_app"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
doctest = false

[features]
# Forward a Vulkan build down to the runtime, the device backends, the compile
# pipeline, and core.
vulkan = [
    "concinnity-client/vulkan",
    "concinnity-device/vulkan",
    "concinnity-cook/vulkan",
    "concinnity-core/vulkan",
]

[dependencies]
# The runtime crate (rlib): App, the renderer, ECS, and asset types.
concinnity-client = { path = "../concinnity-client" }
# The device backends: the Metal shader-layout contract (shader_reflect) and the
# embedded-preview FFI hooks (set_preview_view) the Swift app drives.
concinnity-device = { path = "../concinnity-device" }
# The asset compile pipeline that ffi/authoring drive (gltf/png/jpeg/fbx
# decoders live here, not in core).
concinnity-cook = { path = "../concinnity-cook" }
# Direct core access for the world/geometry/ecs types the authoring code names.
concinnity-core = { path = "../concinnity-core" }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1.44"

[target.'cfg(target_os = "macos")'.dependencies]
# ffi's blocking/preview run loops pump the Cocoa run loop.
core-foundation = "0.10.1"

[dev-dependencies]
tempfile = "3.25.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[build-dependencies]
cbindgen = "0.29"
concinnity-toolchain = { path = "../concinnity-toolchain" }
