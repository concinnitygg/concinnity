[package]
name = "concinnity"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autobenches = false
autotests = false
autobins = false

[lib]
name = "concinnity"
path = "src/lib.rs"

[features]
default = ["cook"]
cook = ["dep:concinnity-cook", "dep:concinnity-world", "dep:concinnity-shader"]
vulkan = ["concinnity-engine/vulkan", "concinnity-shader?/vulkan"]

[dependencies]
concinnity-engine = { path = "crates/concinnity-engine" }
concinnity-memory = { path = "crates/concinnity-memory" }
concinnity-store = { path = "crates/concinnity-store" }
concinnity-cook = { path = "crates/concinnity-cook", optional = true }
concinnity-world = { path = "crates/concinnity-world", optional = true }
concinnity-shader = { path = "crates/concinnity-shader", optional = true }

[dev-dependencies]
concinnity-toolchain = { path = "crates/concinnity-toolchain", features = ["fetch"] }

[build-dependencies]
concinnity-toolchain = { path = "crates/concinnity-toolchain" }

[lints]
workspace = true

[workspace]
resolver = "2"
members = [
    "crates/*",
    "benches",
]

default-members = [
    ".",
    "crates/*",
]

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace.package]
version = "0.18.46"
authors = ["Grant Wilkes <grant@concinnity.gg>"]
edition = "2024"
license = "MIT"

[profile.dev]
opt-level = 2

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
