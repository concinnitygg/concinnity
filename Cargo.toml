[workspace]
resolver = "2"
members = [
    "crates/*",
    "examples/*",
    "benches",
]

default-members = [
    "crates/*",
]

[workspace.package]
version = "0.18.6"
authors = ["Grant Wilkes <grant@concinnity.gg>"]
edition = "2024"
license = "MIT"

[profile.dev]
opt-level = 2

# Build scripts run unoptimized by default, which makes concinnity-render's
# build-time LTC fit (a few million BRDF evaluations) roughly ten times slower
# than it needs to be. The scripts themselves are small, so optimizing them costs
# little to compile and is paid back on the first run.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
