[workspace.package]
version = "0.19.1"
description = "Asset-driven world engine"
authors = ["Grant Wilkes <grant@concinnity.gg>"]
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/concinnitygg/concinnity"
homepage = "https://concinnity.gg"
readme = "README.md"
keywords = ["gamedev", "graphics", "engine", "rendering", "3d"]
categories = ["game-engines", "graphics", "rendering::engine"]

[workspace.dependencies]
concinnity-cook = { path = "crates/concinnity-cook", version = "0.19" }
concinnity-core = { path = "crates/concinnity-core", version = "0.19" }
concinnity-dev = { path = "crates/concinnity-dev", version = "0.19", default-features = false }
concinnity-device = { path = "crates/concinnity-device", version = "0.19", default-features = false }
concinnity-engine = { path = "crates/concinnity-engine", version = "0.19", default-features = false }
concinnity-host = { path = "crates/concinnity-host", version = "0.19" }
concinnity-shader = { path = "crates/concinnity-shader", version = "0.19", default-features = false }
concinnity-slang = { path = "crates/concinnity-slang", version = "0.19" }
concinnity-toolchain = { path = "crates/concinnity-toolchain", version = "0.19" }

[package]
name = "concinnity"
default-run = "concinnity"
include = [
    "/src",
    "/build.rs",
    "/README.md",
    "/LICENSE",
]
version.workspace = true
description.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "concinnity"
required-features = ["editor"]
doc = false

[[bin]]
name = "concinnity-run"
required-features = ["player"]

[[test]]
name = "cli"
required-features = ["editor"]

[[bench]]
name = "suite"
harness = false
required-features = ["cook", "player"]

[workspace]
resolver = "2"
members = [
    "crates/*",
]

[package.metadata.docs.rs]
features = ["cook"]
default-target = "x86_64-apple-darwin"
targets = ["x86_64-apple-darwin", "x86_64-pc-windows-msvc"]

[features]
default = ["std", "native"]
std = ["dep:concinnity-engine"]
player = ["std", "dep:concinnity-toolchain"]
editor = ["player", "cook", "dep:concinnity-dev", "dep:clap"]
cook = ["std", "dep:concinnity-cook", "dep:concinnity-shader"]
native = ["std", "concinnity-engine/native", "concinnity-shader?/native", "concinnity-dev?/native"]
metal = ["std", "concinnity-engine/metal", "concinnity-shader?/metal", "concinnity-dev?/metal"]
directx = ["std", "concinnity-engine/directx", "concinnity-shader?/directx", "concinnity-dev?/directx"]
vulkan = ["std", "concinnity-engine/vulkan", "concinnity-shader?/vulkan", "concinnity-dev?/vulkan"]

[dependencies]
concinnity-core = { workspace = true }
concinnity-engine = { workspace = true, optional = true }
concinnity-cook = { workspace = true, optional = true }
concinnity-shader = { workspace = true, optional = true }
concinnity-dev = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"], optional = true }
thiserror = { version = "2.0.18", default-features = false }

[dev-dependencies]
tempfile = "3.25.0"

[build-dependencies]
concinnity-toolchain = { workspace = true, optional = true }

[[example]]
name = "cube"
required-features = ["std"]

[lints]
workspace = true

[workspace.lints.rust]
unreachable_pub = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
future_incompatible = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
# Suppressions state why, and stop compiling once they stop being needed:
# `expect` reports an allowance the code has outgrown, `allow` never does.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Placeholders and debugging leftovers, none of which currently exist.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Leak-by-omission and precision traps.
mem_forget = "warn"
lossy_float_literal = "warn"
# Shapes that read as a mistake at a glance.
infinite_loop = "warn"
empty_enum_variants_with_brackets = "warn"
mixed_attributes_style = "warn"
unnecessary_self_imports = "warn"

[profile.dev]
opt-level = 2

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
