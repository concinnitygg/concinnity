[workspace.package]
version = "0.20.0"
description = "Asset-driven world engine"
authors = ["Grant Wilkes <grant@concinnity.gg>"]
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/concinnitygg/concinnity"
readme = "README.md"
keywords = ["gamedev", "graphics", "engine", "rendering", "3d"]
categories = ["game-engines", "graphics", "rendering::engine"]

[workspace.dependencies]
concinnity-cook = { path = "crates/concinnity-cook", version = "0.20" }
concinnity-core = { path = "crates/concinnity-core", version = "0.20" }
concinnity-derive = { path = "crates/concinnity-derive", version = "0.20" }
concinnity-dev = { path = "crates/concinnity-dev", version = "0.20" }
concinnity-device = { path = "crates/concinnity-device", version = "0.20" }
concinnity-engine = { path = "crates/concinnity-engine", version = "0.20" }
concinnity-runtime = { path = "crates/concinnity-runtime", version = "0.20" }
concinnity-host = { path = "crates/concinnity-host", version = "0.20" }
concinnity-shader = { path = "crates/concinnity-shader", version = "0.20" }
concinnity-testing = { path = "crates/concinnity-testing" }
concinnity-toolchain = { path = "crates/concinnity-toolchain", version = "0.20" }

ash = "0.38"
bytemuck = { version = "1", default-features = false }
ciborium = "0.2"
fbxcel = { version = "0.9.0", default-features = false }
gltf = { version = "1", default-features = false }
hashbrown = "0.17.1"
hex = "0.4.3"
kira = { version = "0.12", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm"] }
libm = "0.2"
notify = { version = "8", default-features = false }
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
png = "0.18.1"
postcard = { version = "1", default-features = false }
rayon = "1"
serde = { version = "1", default-features = false }
serde_json = "1"
sha2 = "0.11.0"
spin = { version = "0.12.3", default-features = false }
tempfile = "3.25.0"
thiserror = { version = "2.0.18", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = "0.3.22"
windows = "0.62.2"

[package]
name = "concinnity"
default-run = "concinnity"
include = [
    "/src",
    "/build.rs",
    "/README.md",
    "/LICENSE",
]
version.workspace = true
description.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "concinnity"
required-features = ["editor"]
doc = false

[[bin]]
name = "concinnity-run"
required-features = ["player"]

[[test]]
name = "cli"
required-features = ["editor"]

[[bench]]
name = "suite"
harness = false
required-features = ["cook", "player"]

[workspace]
resolver = "2"
members = [
    "crates/*",
]

[package.metadata.docs.rs]
default-target = "x86_64-apple-darwin"
targets = ["x86_64-apple-darwin", "x86_64-pc-windows-msvc"]

[features]
default = ["std", "player", "cook"]
std = ["dep:concinnity-runtime", "dep:concinnity-host", "dep:concinnity-toolchain"]
player = ["std"]
editor = ["player", "cook", "dep:concinnity-dev"]
cook = ["std", "dep:concinnity-cook"]
vulkan = ["std", "concinnity-runtime/vulkan", "concinnity-dev?/vulkan"]

[dependencies]
concinnity-engine = { workspace = true }
concinnity-core = { workspace = true }
concinnity-runtime = { workspace = true, optional = true }
concinnity-host = { workspace = true, optional = true }
concinnity-cook = { workspace = true, optional = true }
concinnity-dev = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
concinnity-testing = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
concinnity-toolchain = { workspace = true, optional = true }

[[example]]
name = "cube"
required-features = ["std"]

[[example]]
name = "planet"
required-features = ["cook"]

[lints]
workspace = true

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unused_import_braces = "warn"
meta_variable_misuse = "warn"
unit_bindings = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"
bare_urls = "warn"
redundant_explicit_links = "warn"
invalid_html_tags = "warn"
invalid_rust_codeblocks = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the domain: GPU math, padded repr(C) fields, settings structs.
cast_precision_loss = "allow"
similar_names = "allow"
many_single_char_names = "allow"
pub_underscore_fields = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Local items read best beside their only use.
items_after_statements = "allow"
# Exact float compares here are change detection, tie-breaks and sentinels; an epsilon changes behavior.
float_cmp = "allow"
# Nursery and restriction lints adopted one by one.
use_self = "warn"
redundant_clone = "warn"
or_fun_call = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
equatable_if_let = "warn"
iter_over_hash_type = "warn"
clone_on_ref_ptr = "warn"
get_unwrap = "warn"
try_err = "warn"
let_underscore_must_use = "warn"
fn_to_numeric_cast_any = "warn"
# No runtime panics; clippy.toml exempts tests.
unwrap_used = "warn"
panic = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# Suppressions state why, and stop compiling once they stop being needed:
# `expect` reports an allowance the code has outgrown, `allow` never does.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Placeholders and debugging leftovers, none of which currently exist.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Leak-by-omission and precision traps.
mem_forget = "warn"
lossy_float_literal = "warn"
# Shapes that read as a mistake at a glance.
infinite_loop = "warn"
empty_enum_variants_with_brackets = "warn"
mixed_attributes_style = "warn"
unnecessary_self_imports = "warn"

[profile.dev]
opt-level = 2

[profile.dev.build-override]
opt-level = 3

# spirv-cross is both a build dependency and a runtime one. Giving the runtime
# copy the build-override settings lets Cargo build its C++ once, not twice.
[profile.dev.package.spirv-cross-sys]
opt-level = 3
debug = false

[profile.release]
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
